<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Goal Tracker by Accessible Academics</title>
  <link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body>
  <header class="app-header">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg width="42" height="42" viewBox="0 0 42 42" role="img" aria-label="Accessible Academics logo">
          <rect width="42" height="42" rx="11" fill="#3f6fe0" />
          <rect x="9" y="24" width="5.5" height="8" rx="1.5" fill="#ffffff" opacity="0.65" />
          <rect x="18.25" y="19" width="5.5" height="13" rx="1.5" fill="#ffffff" opacity="0.85" />
          <rect x="27.5" y="13" width="5.5" height="19" rx="1.5" fill="#ffffff" />
          <circle cx="30.25" cy="10.5" r="3.4" fill="#ffd166" stroke="#3f6fe0" stroke-width="1.6" />
        </svg>
      </span>
      <div>
        <h1>Goal Tracker</h1>
        <p class="tagline">by <strong>Accessible Academics</strong> · Special Education Data</p>
      </div>
    </div>
    <div class="header-actions">
      <span class="privacy-badge" title="All data is stored only in this browser on this device. Nothing is uploaded anywhere.">🔒 Private &amp; offline</span>
    </div>
  </header>

  <nav class="tabs" role="tablist" aria-label="Main navigation">
    <button class="tab" data-view="dashboard" role="tab">Dashboard</button>
    <button class="tab" data-view="students" role="tab">Students</button>
    <button class="tab" data-view="data" role="tab">Collect Data</button>
    <button class="tab" data-view="behavior" role="tab">Behavior (ABC)</button>
    <button class="tab" data-view="reports" role="tab">Reports</button>
    <button class="tab" data-view="backup" role="tab">Backup</button>
  </nav>

  <main id="view" class="view" role="main" aria-live="polite"></main>

  <!-- Modal host -->
  <div id="modal-root"></div>

  <footer class="app-footer">
    <span>Data lives in this browser only. Use <strong>Backup</strong> often to keep a safe copy.</span>
  </footer>

  <script src="assets/js/store.js"></script>
  <script src="assets/js/charts.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
